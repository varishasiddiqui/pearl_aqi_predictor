name: Feature Pipeline

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: {}  # optional manual trigger — not required, pipeline self-backfills automatically

jobs:
  run-feature-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Run feature pipeline
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}  # optional — hazard-AQI alerts skip silently if unset
        run: python feature_pipeline.py
